services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracepoint
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: tracepoint
    volumes:
      - cases:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepoint"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tracepoint:local-dev-only@db:5432/tracepoint
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  cases:
